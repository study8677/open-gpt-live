name: Feature request
description: Propose a focused product or engineering improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the roadmap, existing issues, and pull requests.
          required: true
        - label: This request describes a user problem, not only a preferred implementation.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who has this problem, and what can they not do reliably today?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Voice quality / latency
        - VAD / turn detection
        - Protocol
        - Gateway lifecycle
        - Web experience
        - Provider ecosystem
        - Local AI / privacy
        - Deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe observable behavior and a useful acceptance criterion.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What simpler approaches or workarounds have you tried?

  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Note protocol, provider, privacy, browser, or compatibility implications.

  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Add measurements, traces, mockups, test audio, or links that make the need concrete.
