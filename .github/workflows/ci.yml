name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate Docker Compose profiles
        run: |
          OPEN_GPT_LIVE_ENV_FILE=.env.example docker compose --env-file .env.example config --quiet
          OPEN_GPT_LIVE_ENV_FILE=.env.local-ai.example docker compose --env-file .env.local-ai.example --profile local-ai config --quiet

      - name: Build
        run: pnpm build
